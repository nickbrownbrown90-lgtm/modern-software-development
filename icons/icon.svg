<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Academy Cap / Logo Centerpiece -->
  <g transform="translate(64, 80)">
    <!-- Glow behind logo -->
    <circle cx="192" cy="160" r="140" fill="#38bdf8" opacity="0.12" filter="blur(20px)"/>

    <!-- Mortarboard Cap Diamond -->
    <path d="M 192,60 L 370,140 L 192,220 L 14,140 Z" fill="url(#accent)"/>

    <!-- Cap Base Arc -->
    <path d="M 72,176 L 72,246 C 72,296 312,296 312,246 L 312,176" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>

    <!-- Tassel String and Pendant -->
    <path d="M 230,156 Q 300,180 340,240 L 340,285" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="340" cy="295" r="14" fill="#f59e0b"/>

    <!-- Academy Star of Excellence -->
    <path d="M 192,115 L 202,135 L 224,138 L 208,154 L 212,176 L 192,165 L 172,176 L 176,154 L 160,138 L 182,135 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">TEACH ACADEMY</text>
</svg>
